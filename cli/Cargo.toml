[package]
name = "mailbox-parser-cli"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = "0.4"
mailbox-parser = { path = ".." }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
ureq = { version = "2", optional = true, default-features = false, features = ["json", "tls"] }

[features]
# Optional TypeSafe AI refinement (`typesafe refine` subcommand). Off by default.
typesafe = ["dep:ureq"]

[[bin]]
name = "mailbox-parser-cli"
path = "src/main.rs"
