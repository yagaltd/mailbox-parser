[package]
name = "mailbox-parser"
version = "0.4.0"
edition = "2024"

[features]
default = []
msg-parser = ["dep:msg_parser"]
pst-parser = ["dep:outlook-pst"]
full = ["msg-parser", "pst-parser"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
contacts = { path = "./contacts" }
imap = "3.0.0-alpha.15"
imap-proto = "0.16"
mail-parser = "0.10"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
regex = "1"
log = "0.4"
msg_parser = { version = "0.3", optional = true }
outlook-pst = { version = "1.2", optional = true }

[dev-dependencies]
pretty_assertions = "1"
